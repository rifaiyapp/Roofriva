name: Roofriva Strict Reference QA

on:
  push:
    branches:
      - fix/strict-reference-pass

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          python3 -m http.server 4321 -d dist >/tmp/roofriva-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && break
            sleep 1
          done
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          async function shot(name, viewport, mobile=false){
            const page=await browser.newPage({viewport,isMobile:mobile,deviceScaleFactor:1});
            page.on('console',m=>{if(m.type()==='error') errors.push(`${name}: ${m.text()}`)});
            await page.goto('http://127.0.0.1:4321/',{waitUntil:'networkidle',timeout:120000});
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,height:document.documentElement.scrollHeight,title:document.title}));
            console.log(name, metrics);
            if(metrics.scrollWidth>metrics.clientWidth+1) throw new Error(`${name}: horizontal overflow ${metrics.scrollWidth} > ${metrics.clientWidth}`);
            await page.screenshot({path:`qa-artifacts/${name}.png`,fullPage:true});
            await page.close();
          }
          await shot('roofriva-strict-desktop',{width:1440,height:1000});
          await shot('roofriva-strict-mobile',{width:390,height:844},true);
          console.log('console-errors',errors);
          if(errors.length) process.exitCode=1;
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: roofriva-strict-reference-qa
          path: qa-artifacts/
          if-no-files-found: error
