name: Download Reference-Fit Assets

on:
  push:
    branches:
      - fix/strict-reference-pass
    paths:
      - .github/workflows/download-reference-assets.yml

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-reference-pass
      - name: Download reference-fit roofing imagery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/roofriva
          UA='Mozilla/5.0 RoofrivaTemplate/1.0'
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/34625609/pexels-photo-34625609.jpeg?auto=compress&cs=tinysrgb&w=1800' -o public/assets/roofriva/hero-traditional.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/37121404/pexels-photo-37121404.jpeg?auto=compress&cs=tinysrgb&w=1600' -o public/assets/roofriva/crew-group.jpg
          ls -lh public/assets/roofriva/hero-traditional.jpg public/assets/roofriva/crew-group.jpg
      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Roofriva Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/roofriva/hero-traditional.jpg public/assets/roofriva/crew-group.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add grouped roofing crew image'
          git push origin HEAD:fix/strict-reference-pass
