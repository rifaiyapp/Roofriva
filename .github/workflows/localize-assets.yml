name: Localize Roofriva Assets

on:
  push:
    branches:
      - final/roofriva-reference
    paths:
      - .github/workflows/localize-assets.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/roofriva-reference
      - name: Download optimized roofing assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/roofriva
          UA='Mozilla/5.0 RoofrivaTemplate/1.0'
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/9976121/pexels-photo-9976121.jpeg?auto=compress&cs=tinysrgb&w=1800' -o public/assets/roofriva/hero.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/15806960/pexels-photo-15806960.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/crew.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/7587880/pexels-photo-7587880.jpeg?auto=compress&cs=tinysrgb&w=1400' -o public/assets/roofriva/house.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/9431615/pexels-photo-9431615.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/shingles.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/37704240/pexels-photo-37704240.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/install.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/37704245/pexels-photo-37704245.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/repair.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/33039011/pexels-photo-33039011.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/roof.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/34019841/pexels-photo-34019841.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/inspection.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/31820987/pexels-photo-31820987.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/metal.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/32854133/pexels-photo-32854133.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/tile.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://images.pexels.com/photos/7788264/pexels-photo-7788264.jpeg?auto=compress&cs=tinysrgb&w=1200' -o public/assets/roofriva/faq.jpg
          ls -lh public/assets/roofriva
      - name: Commit local image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Roofriva Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/roofriva
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add local roofing imagery'
          git push origin HEAD:final/roofriva-reference
